name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke-test the script
        run: |
          python3 --version
          python3 -c "import py_compile; py_compile.compile('scripts/feishu_task_card.py', doraise=True)"
          echo "syntax ok"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
